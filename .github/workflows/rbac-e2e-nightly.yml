name: rbac-e2e-nightly

on:
  schedule:
    # UTC 16:00 ≈ 北京时间 00:00
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  rbac-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web_playwright]"
          playwright install chromium

      - name: Install frontend deps
        working-directory: autopilot_platform/frontend
        run: npm ci

      - name: RBAC Web E2E (24 checks)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python tools/rbac_web_e2e.py --report rbac-e2e-report.md

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-e2e-report
          path: rbac-e2e-report.md
          if-no-files-found: ignore
