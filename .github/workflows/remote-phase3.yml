name: Remote Phase 3

on:
  push:
    paths:
      - "autopilot_platform/platform/**"
      - "autopilot_platform/runner/remote/**"
      - "autopilot_platform/frontend/**"
      - "deploy/docker/coturn/**"
      - "tests/test_*remote*.py"
  pull_request:
    paths:
      - "autopilot_platform/platform/**"
      - "autopilot_platform/runner/remote/**"
      - "autopilot_platform/frontend/**"
      - "deploy/docker/coturn/**"
      - "tests/test_*remote*.py"

jobs:
  remote-phase3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: autopilot_platform/frontend/package-lock.json
      - name: Install Python dependencies
        run: pip install -e ".[dev,runner_remote]"
      - name: Remote backend tests
        run: pytest tests/test_device_remote_sessions.py tests/test_remote_link_whitebox.py tests/test_remote_device_dialog_js.py tests/test_remote_turn_optional.py tests/test_remote_phase3_live.py -q
      # TURN：未配置 secrets 时 test_remote_turn_optional 自动 skip
      - name: Remote lint
        run: ruff check autopilot_platform/platform/api/device_remote*.py autopilot_platform/platform/services/device_remote*.py autopilot_platform/runner/remote
      - name: Frontend typecheck and build
        working-directory: autopilot_platform/frontend
        run: npm ci && npm test && npm run typecheck && npm run build
      - name: Validate coturn compose
        working-directory: deploy/docker/coturn
        run: cp .env.example .env && docker compose -f docker-compose.coturn.yml config --quiet
