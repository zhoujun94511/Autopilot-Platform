name: rbac

on:
  push:
    paths:
      - "autopilot_platform/**"
      - "deploy/**"
      - "tests/test_rbac*.py"
      - "tests/test_frontend_persona_capabilities.py"
      - "tests/test_runner_standalone_imports.py"
      - "tests/test_openapi_capability_audit.py"
      - "tests/test_keyword_meta_registry.py"
      - "tests/test_permission_hardening.py"
      - "tests/test_public_bootstrap.py"
      - "tests/test_aud_deferred_slices.py"
      - "tests/test_alembic_cutover.py"
      - "tests/test_archive_exclusion.py"
      - "tests/test_scheduler_no_mq.py"
      - "tests/test_scheduler_leader.py"
      - "tests/test_aud_large_module_inventory.py"
      - "archive/**"
      - "docs/architecture/ADR_scheduler_no_mq.md"
      - "docs/architecture/ADR_large_module_split.md"
      - "docs/architecture/ADR_schema_migration.md"
      - "alembic/**"
      - "alembic.ini"
      - "tools/export_openapi.py"
      - "tools/audit_capability_routes.py"
      - "contracts/openapi/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "autopilot_platform/**"
      - "deploy/**"
      - "tests/test_rbac*.py"
      - "tests/test_frontend_persona_capabilities.py"
      - "tests/test_runner_standalone_imports.py"
      - "tests/test_openapi_capability_audit.py"
      - "tests/test_keyword_meta_registry.py"
      - "tests/test_permission_hardening.py"
      - "tests/test_public_bootstrap.py"
      - "tests/test_aud_deferred_slices.py"
      - "tests/test_alembic_cutover.py"
      - "tests/test_archive_exclusion.py"
      - "tests/test_scheduler_no_mq.py"
      - "tests/test_scheduler_leader.py"
      - "tests/test_aud_large_module_inventory.py"
      - "archive/**"
      - "docs/architecture/ADR_scheduler_no_mq.md"
      - "docs/architecture/ADR_large_module_split.md"
      - "docs/architecture/ADR_schema_migration.md"
      - "alembic/**"
      - "alembic.ini"
      - "tools/export_openapi.py"
      - "tools/audit_capability_routes.py"
      - "contracts/openapi/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  rbac-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: RBAC API + frontend persona + registry
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest \
            tests/test_rbac_caps.py \
            tests/test_rbac_matrix.py \
            tests/test_rbac_api_capability_registry.py \
            tests/test_frontend_persona_capabilities.py \
            tests/test_keyword_meta_registry.py \
            tests/test_runner_standalone_imports.py \
            tests/test_runner_report_delivery.py \
            tests/test_openapi_capability_audit.py \
            tests/test_mgmt_client_openapi.py \
            tests/test_codegen_mgmt_client_stubs.py \
            -q --tb=short

      - name: Credential defaults + bind hardening (AUD-2026-06)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest \
            tests/test_permission_hardening.py \
            tests/test_public_bootstrap.py \
            -q --tb=short

      - name: Alembic cutover + rollback drill (AUD-2026-07)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONUTF8: "1"
        run: |
          pip install -e ".[dev,migrate]"
          python -m pytest \
            tests/test_aud_deferred_slices.py \
            tests/test_alembic_cutover.py \
            tests/test_archive_exclusion.py \
            tests/test_scheduler_no_mq.py \
            tests/test_scheduler_leader.py \
            tests/test_aud_large_module_inventory.py \
            -q --tb=short
          DB="$RUNNER_TEMP/alembic_ci_scratch.db"
          MC_DATABASE_URL="sqlite:///$DB" alembic upgrade head
          MC_DATABASE_URL="sqlite:///$DB" alembic downgrade base
          MC_DATABASE_URL="sqlite:///$DB" alembic upgrade head

      - name: Export OpenAPI + audit capability routes + mgmt client
        run: |
          # AUD-2026-11：先校验仓内契约未漂移，再导出供审计脚本使用
          python tools/export_openapi.py --check
          python tools/export_openapi.py --pretty
          python tools/audit_capability_routes.py
          python tools/codegen_mgmt_client_stubs.py --write autopilot_platform/ap/mgmt/client_ops_generated.py
          python -m pytest \
            tests/test_mgmt_client_openapi.py \
            tests/test_codegen_mgmt_client_stubs.py \
            tests/test_openapi_capability_audit.py \
            -q --tb=short

  rbac-whitebox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Three-account API whitebox chain
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/test_rbac_whitebox_chain.py -q --tb=short
